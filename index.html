<!doctype html><html lang="ko"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>원마킹툴 · 프로토타입</title><style>
:root{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;color-scheme:dark;background:#0b1323;color:#e9effc}*{box-sizing:border-box}body{margin:0;background:#0b1323}.app{max-width:470px;margin:auto;padding:15px 13px 40px}header{text-align:center;padding:8px 0 15px}h1{font-size:25px;margin:0 0 5px;letter-spacing:-.8px}.creator{color:#8b9cb6;font-size:11px}.sub{color:#9aaac3;font-size:12px;margin-top:7px}.card{background:#172237;border:1px solid #283751;border-radius:16px;padding:14px;margin-bottom:10px}.head{display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:800;margin-bottom:10px}.num{background:#273958;color:#bed8ff;border-radius:7px;font-weight:700;padding:3px 7px;font-size:11px}.line{display:flex;gap:8px}.field{flex:1;min-width:0}.field label{font-size:11px;color:#a7b9d2;display:block;margin-bottom:6px}input{width:100%;color:#fff;background:#0d182b;border:1px solid #40516a;padding:11px 9px;border-radius:9px;font-size:17px;font-weight:700;outline:none}input:focus{border-color:#4a9dff}small{font-size:11px;color:#9db0ca}.hint{font-size:12px;color:#bac9e0;line-height:1.5;margin-top:8px}.warning{border-radius:11px;background:#483420;border:1px solid #8e6636;color:#ffdbad;padding:10px 11px;font-size:12px;margin:12px 0 0}.good{background:#1b4037;border-color:#32745d;color:#a4ead0}.mode-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.mode{padding:10px 3px;background:#0d182b;color:#b8c9e1;border:1px solid #3a4a66;border-radius:9px;font-size:12px;font-weight:700;cursor:pointer}.mode.active{background:#165d9e;border-color:#65b7ff;color:white}.split{display:flex;gap:6px;margin-top:9px}.split button{flex:1;padding:8px 3px;border:1px solid #3b4c66;background:#0d182b;color:#b6c9e1;border-radius:8px;font-size:12px}.split button.active{background:#284c7c;border-color:#71adf0;color:white}.mark{display:grid;grid-template-columns:45px 1fr 78px;gap:9px;align-items:center;padding:9px 3px;border-bottom:1px solid #2b3c55}.mark:last-child{border-bottom:0}.pill{border-radius:8px;background:#2e4361;text-align:center;padding:7px 3px;font-size:12px;font-weight:700}.pos{font-size:22px;font-weight:800;letter-spacing:-.4px}.kind{text-align:right;font-size:12px;color:#b2c4db}.cut{background:#102c26;border-radius:9px;margin-top:8px;padding:9px 7px;border-bottom:0}.cut .pill{background:#176653}.cut .pos{color:#65e0b4}.muted{color:#8e9fb9;font-size:11px}.mainval{font-size:25px;font-weight:900;color:#8ac9ff}.math{display:grid;grid-template-columns:1fr 1fr;gap:6px}.stat{background:#0d182b;border-radius:8px;padding:10px}.stat strong{display:block;font-size:17px;margin-top:3px}.footer{font-size:11px;line-height:1.6;color:#8d9eb7;margin-top:10px}button{touch-action:manipulation} @media(min-width:650px){.app{margin:28px auto}.card{box-shadow:0 14px 36px #0002}} </style><style id="multi-style">.short-card{background:#0d182b;border:1px solid #38506b;border-radius:12px;padding:12px;margin-top:10px}.short-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.short-top strong{font-size:14px}.short-top .num{background:#554027;color:#ffe0ab}.angleline{margin-top:12px;align-items:flex-end}.anglebox{color:#8ac9ff;font-size:20px;font-weight:800;padding-bottom:7px}.segline{font-size:12px;padding:8px 0;border-bottom:1px solid #2e3e55;display:flex;justify-content:space-between;gap:8px}.segline:last-child{border:0}.bad{color:#ffb0a5}.ok{color:#a0e5c9}.mode{min-height:46px}.short-card input{font-size:16px}.stat strong{font-size:15px}.note{font-size:12px;line-height:1.45;margin-top:8px;color:#bccce1}</style></head><body><main class="app"><header><h1>원마킹툴</h1><div class="creator">만든사람 이대희</div><div class="sub">도면 치수 → 밴딩 옵션 → 마킹 & 커팅</div></header>
<section class="card"><div class="head">① 도면 입력 <span class="num">mm</span></div><div class="field"><label>완성 도면 치수 (하이픈 구분)</label><input id="dims" value="200-150-50-250-50-300" inputmode="text"></div><div class="hint">예: 200-150-50-250-300</div><div class="line" style="margin-top:12px"><div class="field"><label>R (중심선 반경)</label><input id="radius" type="number" value="38" step="0.1"></div><div class="field"><label>추가 최소물림</label><input id="grip" type="number" value="30" step="0.1"></div><div class="field"><label>90°+90° 최소</label><input id="minimum" type="number" value="110" step="0.1"></div></div><div id="warn" class="warning">⚠ 50mm 구간 감지 · 최소 110mm 미달</div></section>
<section class="card"><div class="head">② 짧은 구간별 밴딩 설정 <span class="num" id="countshort">0개</span></div><div id="shortcards"></div></section>
<section class="card"><div class="head">③ 전체 차감 & 전개 <span class="num">자동</span></div><div id="summary" class="hint"></div><div id="segments" class="segment-list"></div><div class="math" style="margin-top:9px"><div class="stat"><small>차감 밑변 합계</small><strong id="totalbase">—</strong></div><div class="stat"><small>계산용 전개 길이 합계</small><strong id="developed">—</strong></div></div></section>
<section class="card"><div class="head">④ 마킹 & 커팅 <span class="num">파이프 끝 0점 기준</span></div><div id="marks"></div></section><div class="footer">시제품 · 짧은 구간을 각각 설정하며 전체 누적 마킹을 재계산합니다. 실제 작업 전에는 벤더별 마킹 기준과 각도별 가공 오차를 검증하세요. 계산 과정의 중간 반올림을 최소화합니다.</div></main>
<script>
const el=id=>document.getElementById(id),pi=Math.PI;
const fmt=(n,d=2)=>Number.isFinite(n)?n.toFixed(d):'—';
const setback=(r,a)=>r*Math.tan(a*pi/360),arc=(r,a)=>pi*r*a/180;
const required=(r,g,a,m)=>((m===1||m===2)?r+setback(r,a):2*setback(r,a))+g;
const config=new Map();
function maxA(h,r,g,m){let lo=0.00001,hi=89.999;for(let i=0;i<60;i++){const mid=(lo+hi)/2;if(h/Math.sin(mid*pi/180)>=required(r,g,mid,m))lo=mid;else hi=mid;}return lo;}
const parseDims=v=>v.trim().split(/[-,\s]+/).filter(Boolean).map(Number);
function getConfig(idx,order){if(!config.has(idx))config.set(idx,{mode:order===0?1:0,split:.5,auto:true,angle:38});return config.get(idx);}
function render(){
const ds=parseDims(el('dims').value),r=+el('radius').value,g=+el('grip').value,minimum=+el('minimum').value;
const valid=ds.length>=3&&ds.every(n=>Number.isFinite(n)&&n>0)&&r>0&&g>=0&&minimum>0;
if(!valid){el('warn').textContent='도면을 3개 이상 구간으로 입력하고 R·물림·최소값을 확인해 주세요.';el('shortcards').innerHTML='';el('marks').innerHTML='';el('segments').innerHTML='';return;}
const shortIndices=ds.map((n,i)=>i>0&&i<ds.length-1&&n<minimum?i:-1).filter(i=>i>=0);
const validSet=new Set(shortIndices);for(const idx of config.keys())if(!validSet.has(idx))config.delete(idx);
el('countshort').textContent=shortIndices.length+'개';el('warn').className=shortIndices.length?'warning':'warning good';el('warn').textContent=shortIndices.length?`⚠ 최소 ${fmt(minimum)}mm 미달: ${shortIndices.map(i=>`${i+1}번째 구간 ${fmt(ds[i])}mm`).join(', ')}`:'✓ 최소값 미달 구간 없음';
const lens=ds.slice(),angles=Array(ds.length-1).fill(90),deductions=Array(ds.length).fill(0);
let bad=[],totalbase=0,panels=[];
shortIndices.forEach((idx,order)=>{
const cfg=getConfig(idx,order),height=ds[idx],max=maxA(height,r,g,cfg.mode);
if(cfg.auto)cfg.angle=Math.floor(max*100)/100;
const angle=cfg.angle,angleValid=angle>0&&angle<90&&angle<=max+1e-7;
const b=height/Math.tan(angle*pi/180),hyp=height/Math.sin(angle*pi/180);
const front=cfg.mode===2?b:cfg.mode===1?0:cfg.split===0?b:cfg.split===1?0:b/2;
const back=cfg.mode===1?b:cfg.mode===2?0:cfg.split===1?b:cfg.split===0?0:b/2;
if(!angleValid)bad.push(`${idx+1}번째 구간 예각이 최대 ${fmt(max)}°를 초과하거나 올바르지 않음`);
if(!Number.isFinite(b)||!Number.isFinite(hyp))bad.push(`${idx+1}번째 구간 계산 오류`);
else {deductions[idx-1]+=front;deductions[idx+1]+=back;lens[idx]=hyp;totalbase+=b;}
// Adjacent short segments can share bend; their angles must agree to define geometry.
const aLeft=cfg.mode===1?90:angle,aRight=cfg.mode===2?90:angle;
if(angles._assigned?.has(idx-1)&&Math.abs(angles[idx-1]-aLeft)>1e-7)bad.push(`${idx}번 밴딩 위치에서 인접한 짧은 구간의 각도 설정이 충돌`);
if(angles._assigned?.has(idx)&&Math.abs(angles[idx]-aRight)>1e-7)bad.push(`${idx+1}번 밴딩 위치에서 인접한 짧은 구간의 각도 설정이 충돌`);
if(!angles._assigned)angles._assigned=new Set();angles[idx-1]=aLeft;angles[idx]=aRight;angles._assigned.add(idx-1);angles._assigned.add(idx);
const splitUI=cfg.mode===0?`<div class="hint">밑변 차감 방향</div><div class="split">${[['앞쪽',0],['뒤쪽',1],['50:50',.5]].map(([label,value])=>`<button type="button" data-idx="${idx}" data-split="${value}" class="${cfg.split===value?'active':''}">${label}</button>`).join('')}</div>`:'';
panels.push(`<div class="short-card"><div class="short-top"><strong>${order+1}번째 짧은 구간 · 도면 ${idx+1}번</strong><span class="num">${fmt(height)} mm</span></div><div class="mode-grid">${['① 예각<br>+ 예각','② 90°<br>+ 예각','③ 예각<br>+ 90°'].map((name,m)=>`<button type="button" class="mode ${cfg.mode===m?'active':''}" data-idx="${idx}" data-mode="${m}">${name}</button>`).join('')}</div>${splitUI}<div class="line angleline"><div class="field"><label>예각(°) · 변경 가능</label><input type="number" inputmode="decimal" min="0.01" max="89.99" step="0.01" data-idx="${idx}" data-angle value="${fmt(angle)}"></div><div class="field"><label>최대 가능 예각</label><div class="anglebox">${fmt(max)}°</div></div></div><div class="note ${angleValid?'ok':'bad'}">${angleValid?'✓ 물림 조건 충족':'⚠ 물림 조건 불충족'} · 밑변 ${fmt(b)} mm · 앞 −${fmt(front)} / 뒤 −${fmt(back)} mm</div><div class="note">대각 ${fmt(hyp)} mm · 셋백 ${fmt(setback(r,angle))} mm</div></div>`);
});
el('shortcards').innerHTML=panels.join('')||'<div class="hint">미달 구간이 없습니다. 전체 90°로 계산합니다.</div>';
for(let i=0;i<lens.length;i++)if(deductions[i])lens[i]-=deductions[i];
for(let i=0;i<lens.length;i++)if(!Number.isFinite(lens[i])||lens[i]<=0)bad.push(`${i+1}번째 구간: 차감 후 길이 ${fmt(lens[i])}mm (부족)`);
el('summary').textContent='각 짧은 구간의 차감량을 합산하여 전체 도면에 적용합니다.';
el('segments').innerHTML=lens.map((v,i)=>`<div class="segline"><span>${i+1}번 구간 (${fmt(ds[i])}mm)</span><span class="${v<=0?'bad':''}">${deductions[i]?`−${fmt(deductions[i])} → `:''}<b>${fmt(v)} mm</b>${shortIndices.includes(i)?' · 대각':''}</span></div>`).join('');
el('totalbase').textContent=fmt(totalbase)+' mm';
let developed=lens.reduce((s,v)=>s+v,0);for(let i=0;i<angles.length;i++)developed+=arc(r,angles[i])-2*setback(r,angles[i]);el('developed').textContent=fmt(developed)+' mm';
if(bad.length){el('marks').innerHTML='<div class="warning">⚠ '+bad.join('<br>⚠ ')+'<br>마킹·커팅 결과를 표시하지 않습니다.</div>';return;}
let cur=lens[0]-setback(r,angles[0]);const marks=[{p:cur,a:angles[0]}];
for(let i=1;i<angles.length;i++){cur+=arc(r,angles[i-1])+lens[i]-setback(r,angles[i-1])-setback(r,angles[i]);marks.push({p:cur,a:angles[i]});}
const cut=cur+arc(r,angles.at(-1))+lens.at(-1)-setback(r,angles.at(-1));
if(marks.some((m,i)=>!Number.isFinite(m.p)||(i&&m.p<=marks[i-1].p))||!Number.isFinite(cut)||cut<=marks.at(-1).p){el('marks').innerHTML='<div class="warning">⚠ 전개 마킹이 겹치거나 순서가 역전되었습니다. 구간과 물림 조건을 검토하세요.</div>';return;}
el('marks').innerHTML=marks.map((m,i)=>`<div class="mark"><div class="pill">${i+1}</div><div class="pos">${fmt(m.p)} <small>mm</small></div><div class="kind">${fmt(m.a,m.a===90?0:2)}° 밴딩</div></div>`).join('')+`<div class="mark cut"><div class="pill">커팅</div><div class="pos">${fmt(cut)} <small>mm</small></div><div class="kind">절단 위치</div></div>`;
}
// Event delegation survives re-rendered short-segment cards.
el('shortcards').addEventListener('click',e=>{const btn=e.target.closest('button[data-idx]');if(!btn)return;const cfg=config.get(+btn.dataset.idx);if('mode'in btn.dataset){cfg.mode=+btn.dataset.mode;cfg.auto=true;}if('split'in btn.dataset)cfg.split=+btn.dataset.split;render();});
el('shortcards').addEventListener('input',e=>{if(!e.target.matches('input[data-angle]'))return;const cfg=config.get(+e.target.dataset.idx);cfg.auto=false;cfg.angle=+e.target.value;const focusIdx=+e.target.dataset.idx;render();const next=el('shortcards').querySelector(`input[data-angle][data-idx="${focusIdx}"]`);if(next){next.focus();}});
['dims','radius','grip','minimum'].forEach(id=>el(id).addEventListener('input',render));render();
</script></body></html>
